# Cloud Build pipeline — AI Studio GCP deployment (SSD201 fork)
#
# Triggered on pushes to the `dev` branch (or manually via `gcloud builds submit`).
# Builds a production Docker image, pushes it to Artifact Registry, and deploys
# to Cloud Run.
#
# Required substitution variables (set in Cloud Build trigger or pass via --substitutions):
#   _REGION          GCP region, e.g. us-central1
#   _SERVICE_NAME    Cloud Run service name, e.g. aistudio
#   _REPO            Artifact Registry repo, e.g. aistudio-images
#   _AUTH_SECRET     Secret Manager secret name for NEXTAUTH_SECRET
#
# Optional:
#   _MIN_INSTANCES   Minimum Cloud Run instances (default: 0)
#   _MAX_INSTANCES   Maximum Cloud Run instances (default: 10)
#   _MEMORY          Cloud Run container memory (default: 2Gi)
#   _CPU             Cloud Run container CPUs (default: 2)

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: aistudio
  _REPO: aistudio-images
  _AUTH_SECRET: aistudio-nextauth-secret
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "10"
  _MEMORY: 2Gi
  _CPU: "2"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8   # Faster builds; Next.js webpack build is CPU-bound

steps:
  # ── 1. Build Docker image ────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - .
    env:
      - DOCKER_BUILDKIT=1

  # ── 2. Push image to Artifact Registry ──────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}
    waitFor:
      - build

  # ── 3. Deploy to Cloud Run ───────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --port
      - "3000"
      - --memory
      - ${_MEMORY}
      - --cpu
      - ${_CPU}
      - --min-instances
      - ${_MIN_INSTANCES}
      - --max-instances
      - ${_MAX_INSTANCES}
      - --timeout
      - "300"
      - --concurrency
      - "80"
      - --set-env-vars
      - NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,PORT=3000,HOSTNAME=0.0.0.0
      - --set-secrets
      # Map Secret Manager secrets to environment variables.
      # Format: ENV_VAR=secret-name:version
      - NEXTAUTH_SECRET=${_AUTH_SECRET}:latest
      - --service-account
      - aistudio-cloudrun@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
    waitFor:
      - push

# Image pushed to Artifact Registry (used by Cloud Build to cache layers)
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest
