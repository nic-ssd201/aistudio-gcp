  <path d="M26 130 Q 55 108 90 126 Q 125 144 158 120 Q 180 104 174 140 L 174 160 L 26 160 Z" fill="#6BA89F"/>
  <path d="M26 150 Q 60 132 100 146 Q 140 160 174 142 L 174 164 L 26 164 Z" fill="#4B7BA7" opacity="0.85"/>
