  <circle cx="100" cy="100" r="96" fill="#FAF2EC" stroke="#1B365D" stroke-width="4"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#A86A5A" stroke-width="2"/>
  <!-- Curved top text path for "SUNNYSIDE" -->
  <defs>
    <path id="top-arc" d="M 20,100 A 80,80 0 0 1 180,100" fill="none"/>
    <path id="bottom-arc" d="M 24,104 A 76,76 0 0 0 176,104" fill="none"/>
  </defs>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1B365D" letter-spacing="3">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">SUNNYSIDE</textPath>
  </text>
  <!-- Sun rays -->
  <g fill="#C2735C">
    <path d="M100 70 L105 52 L95 52 Z"/>
    <path d="M120 78 L132 64 L124 58 Z"/>
    <path d="M80 78 L68 64 L76 58 Z"/>
    <path d="M130 95 L148 90 L148 100 Z"/>
