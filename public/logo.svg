  <!-- Bottom label -->
  <text x="100" y="174" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-weight="700" fill="#FAF2EC" letter-spacing="2">SCHOOL DISTRICT</text>
</svg>
