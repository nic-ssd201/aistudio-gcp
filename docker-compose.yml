version: '3.8'

services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Enable BuildKit for cache mounts
      args:
        DOCKER_BUILDKIT: 1
    ports:
      - "3000:3000"
    environment:
      # Node environment
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

      # Next.js configuration
      - NEXT_TELEMETRY_DISABLED=1

      # Memory optimization - 70% of container memory (2GB = 1400MB)
      # Adjust based on actual resource limits below
      - NODE_OPTIONS=--max-old-space-size=1400

      # Authentication (Google OIDC via NextAuth v5)
      - AUTH_URL=${AUTH_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}

      # Database — use one of:
      #   DATABASE_URL (direct URL, local dev)
      #   DB_HOST + DB_USER + DB_PASSWORD (TCP / Cloud SQL via IP)
      #   CLOUD_SQL_SOCKET_PATH + DB_USER + DB_PASSWORD (Cloud Run socket)
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_HOST=${DB_HOST:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-aistudio}

      # Storage (GCS) — env-validation.ts requires GCS_BUCKET (not GCS_BUCKET_NAME)
      - GCS_BUCKET=${GCS_BUCKET}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    # Enable init process for proper signal handling
    init: true

    restart: unless-stopped

networks:
  default:
    name: aistudio-network
